name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      packages:
        description: Stage unsigned native packages in a private draft release
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest'
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate commit messages
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_commit="$(git merge-base HEAD "$PR_BASE_SHA")"
            node scripts/commit-message.mjs --range "${base_commit}..HEAD"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] && \
            git merge-base --is-ancestor "${BEFORE_SHA}" HEAD; then
            node scripts/commit-message.mjs --range "${BEFORE_SHA}..HEAD"
          else
            node scripts/commit-message.mjs --git-head
          fi

      - name: Run package check
        run: npm run ci-check

      - name: Build unsigned macOS package
        if: matrix.os == 'macos-latest'
        run: npm run package

      - name: Launch the sandboxed Electron application
        if: matrix.os == 'macos-latest'
        run: npm run electron-check

  prepare-package-release:
    needs: quality
    if: github.repository == 'openminion/desktop' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create private draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Desktop package $tag" \
            --notes "Private temporary unsigned packages for native verification."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.target }})
    if: github.repository == 'openminion/desktop' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.packages
    needs: [quality, prepare-package-release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: macos-arm64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: windows-latest
            target: windows-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned native packages
        run: npm run make

      - name: Stage packages in the private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-package-release.outputs.tag }}
        run: |
          while IFS= read -r -d '' package; do
            gh release upload \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "$package"
          done < <(find out/make -type f -print0)
