name: Runtime qualification

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact immutable openminion/runtime Release tag
        required: true
        type: string
      release_id:
        description: Opaque binary runtime release identity
        required: true
        type: string
      desktop_version:
        description: Stable Desktop version being qualified
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
            executable: out/OpenMinion-darwin-arm64/OpenMinion.app/Contents/MacOS/OpenMinion
          - runner: ubuntu-22.04
            target: linux-x64
            executable: out/OpenMinion-linux-x64/OpenMinion
          - runner: windows-2022
            target: win32-x64
            executable: out/OpenMinion-win32-x64/OpenMinion.exe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require a stable released Desktop identity
        shell: bash
        run: |
          node -e 'if (!/^\d+\.\d+\.\d+$/.test(process.argv[1]) || process.argv[1] === "0.0.0") process.exit(1)' "${{ inputs.desktop_version }}"
          npm version "${{ inputs.desktop_version }}" --no-git-tag-version --allow-same-version
      - name: Build the exact packaged Desktop
        run: npm ci && npm run make
      - name: Qualify exact immutable runtime bytes
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          executable="$PWD/$EXECUTABLE"
          package=$(find out/make -type f -name '*.zip' -print -quit)
          test -n "$package"
          evidence="$RUNNER_TEMP/qualification-$TARGET.json"
          command=(node tests/electron/packaged-runtime.mjs \
            "$executable" \
            "${{ inputs.desktop_version }}" \
            --qualify-binary \
            "${{ inputs.release_tag }}" \
            "${{ inputs.release_id }}" \
            "$PWD/$package" \
            "$evidence" \
            "$GITHUB_SHA")
          if [ "$TARGET" = linux-x64 ]; then
            xvfb-run -a "${command[@]}"
          else
            "${command[@]}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-${{ matrix.target }}
          path: ${{ runner.temp }}/qualification-${{ matrix.target }}.json
          if-no-files-found: error

  evidence:
    needs: qualify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-*
          path: qualification-fragments
          merge-multiple: true
      - name: Merge qualification evidence and open the review PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.release_tag }}"
          version=${version#runtime-v}
          version=${version%%-${{ inputs.release_id }}}
          evidence_id="desktop-${{ inputs.desktop_version }}-${{ inputs.release_id }}"
          destination="releases/runtime-certification/v1/binary-qualification/$version/$evidence_id.json"
          branch="runtime-certification/${{ inputs.release_id }}"
          inputs=(qualification-fragments/qualification-*.json)
          test "${#inputs[@]}" -eq 3
          node scripts/runtime-qualification.mjs "$destination" "${inputs[@]}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "$branch"
          git add "$destination"
          git commit -m "test(runtime): certify ${{ inputs.release_tag }}"
          git push origin "$branch"
          body="$RUNNER_TEMP/runtime-qualification-pr.md"
          printf '%s\n' \
            '- certify exact immutable runtime bytes on macOS arm64, Linux x64, and Windows x64' \
            '- bind native trust, packaged Desktop, activation, shutdown, and same-chat evidence' \
            '- keep the binary feed unchanged until this evidence and the separate metadata PR are reviewed' \
            '' \
            'Validation' \
            "- Runtime qualification workflow ${GITHUB_RUN_ID}" > "$body"
          url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Certify ${{ inputs.release_tag }} for Desktop" \
            --body-file "$body"
          )
          gh workflow run ci.yml --ref "$branch" --field packages=false
          {
            echo '## Runtime qualification ready for review'
            echo
            echo "- Evidence: \`$destination\`"
            echo "- Evidence commit: \`$(git rev-parse HEAD)\`"
            echo "- Evidence ID: \`$evidence_id\`"
            echo "- Pull request: $url"
            echo '- The runtime remains undiscoverable until this PR and the later OpenMinion metadata PR are merged.'
          } >> "$GITHUB_STEP_SUMMARY"
